name: Nightly dev refresh

# Replaces appdev's database with a scrubbed copy of production, every night.
#
# WHY THIS RUNS AT ALL
#
# appdev is where the platform owner reviews work, and it is only useful if it looks like the
# real thing. Left alone it drifts: yesterday's test bookings, a package half-redeemed by a
# browser test, providers whose services no longer match. A nightly copy makes "it works on
# appdev" mean something.
#
# WHY IT IS SAFE
#
# `refresh-dev.ts` loads and scrubs inside ONE transaction, so appdev never serves real client
# details at any instant — not even briefly, and not if this job dies halfway. See that file.
#
# The production credential here is READ-ONLY BY INTENTION but not by enforcement — give it a
# role that cannot write, and this workflow becomes incapable of touching production even if
# something in it is wrong.

on:
  schedule:
    # 09:40 UTC — 03:40 Denver in summer, 02:40 in winter. Deliberately not on the hour:
    # GitHub's scheduler queues everything set to :00 and can delay it by many minutes.
    - cron: '40 9 * * *'
  # So a failed night can be retried without waiting for the next one.
  workflow_dispatch:

# One at a time. Two of these overlapping would have the second truncating the table the first
# is restoring into.
concurrency:
  group: nightly-dev-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MELANITE_ENV: dev
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      SOURCE_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL_READONLY }}
      STRIPE_SECRET_KEY_WRITE: ${{ secrets.DEV_STRIPE_SECRET_KEY_WRITE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ubuntu-latest ships an older client than Neon's Postgres 18. A pg_dump older than the
      # server refuses outright ("server version mismatch"), so the version is pinned rather
      # than left to whatever the runner image happens to carry this month.
      - name: Install PostgreSQL 18 client
        # A slow apt mirror must not be able to eat the whole job. On 2026-08-19 this step
        # spent 19m56s retrying azure.archive.ubuntu.com and the run was cancelled at the
        # 20-minute job timeout having copied nothing. A step timeout turns that into a
        # fast, legible failure rather than a silent consumption of the entire budget.
        timeout-minutes: 6
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail --retry 3 --retry-delay 2 --max-time 60 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          # Refresh ONLY the pgdg list. Ubuntu’s own archives are already indexed in the
          # runner image and are not what this step is here for — reaching for them is
          # exactly what hung, and every index it did fetch from them went unused.
          # List-Cleanup=0 stops apt discarding the indexes it is not refreshing.
          sudo apt-get update \
            -o Dir::Etc::sourcelist=sources.list.d/pgdg.list \
            -o Dir::Etc::sourceparts=- \
            -o APT::Get::List-Cleanup=0

          # If the image’s indexes turn out to be stale after all, a dependency will not
          # resolve — fall back to the full update rather than losing the night to it.
          sudo apt-get install -y postgresql-client-18 \
            || { sudo apt-get update && sudo apt-get install -y postgresql-client-18; }

          # Installing 18 is NOT enough on its own. /usr/bin/pg_dump is postgresql-common's
          # wrapper and it resolves to the DEFAULT installed major, which on this runner is the
          # preinstalled 16 — so the first attempt at this died on "server version: 18.4;
          # pg_dump version: 16.14" having installed 18 successfully. Put the versioned
          # directory first for every later step.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

          # Absolute path, because $GITHUB_PATH only affects SUBSEQUENT steps — bare `pg_dump`
          # here would still report 16 and prove nothing.
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Copy production into dev, scrubbed
        run: npm run db:refresh-dev

      # Outside the transaction on purpose: this talks to the Stripe API, which cannot be rolled
      # back. Production's LIVE Connect ids are invisible to a test-mode key, so until this runs
      # appdev can take no payments. That is broken, not unsafe.
      - name: Give providers test-mode Stripe accounts
        run: npx tsx --tsconfig scripts/tsconfig.json scripts/dev-connect-accounts.ts

      # Independent of the run that just happened. The refresh asserts its own scrub; this asks
      # the question again from outside, so a bug that made the assertion vacuous still gets
      # caught before anybody looks at appdev.
      # Production has no house provider — that is the thing being reviewed — so the copy puts
      # the owner back on the revenue split with no licence and no services, and appdev stops
      # being able to demonstrate the feature at all. Same shape as the Connect repair above.
      - name: Restore the house provider
        run: npx tsx --tsconfig scripts/tsconfig.json scripts/dev-house-provider.ts

      - name: Confirm nothing identifying survived
        run: npm run db:scrub -- --check
