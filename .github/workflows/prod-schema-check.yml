name: Production schema check

# Does production have the schema the code on main expects?
#
# WHY THIS EXISTS
#
# On 2026-08-19 the prepaid/gift-card feature merged to main and deployed. Its CODE went live;
# its MIGRATIONS did not. Production sat without `prepaid_balances`, `prepaid_redemptions` and
# `prepaid_checkout_links` for about ten hours, during which `/app/appointments` returned a
# server error for every provider — `getAppointments` runs an `exists (… from
# prepaid_redemptions …)` on every row, and Postgres cannot plan a query against a table that
# is not there. Cancelling an appointment was broken for the same reason. It surfaced because a
# provider texted Keoni, which is the worst available monitoring.
#
# Nothing caught it, and nothing structurally could have:
#
#   - The vitest suite runs against DEV, which has every migration applied. A test suite
#     pointed at dev can never see production schema drift, however green it is.
#   - Vercel deploys code. It has no idea a migration exists.
#   - `db:verify` would have found it in one command, and nobody had a reason to run it.
#
# So it runs here instead of relying on somebody remembering on the night they are tired.
#
# WHY IT IS SAFE
#
# `verify-schema.ts` only reads — no DDL, no DML — and the credential is the same read-only
# production role the nightly refresh uses. Read-only by intention AND by grant, so this
# workflow is incapable of touching production even if something in it is wrong.

on:
  # The moment that matters: a deploy just went out, so ask immediately whether the database
  # underneath it agrees with the code. A failure here means the schema is behind and something
  # is already broken in production — not that a future deploy might be.
  push:
    branches: [main]

  # The moment BEFORE it matters. On push this workflow is a smoke alarm: it tells you the
  # outage has already started. Here it is a fuse.
  #
  # 2026-08-19 was not caused by nobody knowing the rule. It was caused by the rule living in
  # somebody's head on the night they were tired. A merge to main deploys code, and code that
  # names a table production does not have takes down every page whose query mentions it —
  # `getAppointments` left-joins `end_of_use_checklists` on every row for the close-out feature,
  # the same exposure `prepaid_redemptions` had when /app/appointments died for ten hours.
  #
  # So the question moves one step earlier: does production ALREADY have the schema this branch
  # expects? If not, this fails and the merge is blocked until the migrations are applied.
  #
  # This makes "migrate first, then merge" mandatory rather than advised. That ordering is safe
  # in this repo because migrations are additive — a table production has but no deployed code
  # reads yet costs nothing, while the reverse is an outage.
  pull_request:
    branches: [main]

  schedule:
    # 10:10 UTC. Drift does not only arrive by push: a migration applied by hand can fail
    # halfway, and `scripts/migrate.ts` runs without a transaction precisely so that enum
    # changes work, which means a partial application is a real state.
    #
    # Deliberately not on the hour — GitHub queues everything set to :00 — and deliberately
    # after the 09:40 dev refresh rather than beside it.
    - cron: '10 10 * * *'

  workflow_dispatch:

# A queued run tells you nothing the newer one will not. Cancel it.
concurrency:
  # Per-ref, not global. A PR run and the post-deploy run on main answer different questions —
  # "may I merge this?" and "is production broken right now?" — and a global group let the
  # first cancel the second.
  group: prod-schema-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Stated, never inferred — `requireEnv` refuses an absent value, and a branch name says
      # where the code is, never where the data is. Scoped to this job, which is unrelated to
      # the Vercel variable of the same name (that one is deliberately absent from Preview;
      # see docs/decisions.md).
      MELANITE_ENV: prod
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL_READONLY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci`, not `npm install` — see AGENTS.md. If this step fails on a lock file the
      # tests were happy with, the lock was written by npm 11 and needs `npx npm@10 install`.
      - run: npm ci

      # Fails the run when a table is missing, a guarantee is absent, or the journal is short
      # of the migrations on disk. The output names the host it checked and never the
      # credentials.
      #
      # `db:verify` also checks that photo storage answers, and that check SKIPS here — it needs
      # `BLOB_READ_WRITE_TOKEN`, and a Vercel blob token is read-write with no read-only variant.
      # Handing this workflow one would give it the power to delete production photographs, which
      # is the opposite of the read-only-by-grant posture the header describes. The skip is
      # printed, not swallowed. It is covered instead by the deploy runbook's
      # `MELANITE_ENV_FILE=.env.migration npm run db:verify`, which runs with real credentials.
      - name: Verify production schema matches the migrations on disk
        run: npm run db:verify

      # The same failure means two different things depending on when it is asked, and telling
      # a reviewer that production is "broken RIGHT NOW" when they have merely opened a pull
      # request is how a useful alarm becomes one people learn to ignore.
      - name: What to do when this fails
        if: failure()
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::error::Production is missing schema this branch expects. Do not merge yet."
            echo ""
            echo "NOTHING IS BROKEN YET. This ran before the merge, which is the point."
            echo "Merging would deploy code naming tables or columns production does not have,"
            echo "and every page whose query mentions one would start returning a server error."
            echo ""
            echo "Apply the pending migrations to production FIRST, then re-run this check:"
            echo ""
            echo "  MELANITE_ENV_FILE=.env.migration npm run db:migrate"
            echo "  MELANITE_ENV_FILE=.env.migration npm run db:verify"
            echo ""
            echo "Applying them before the merge is safe: a table production has but no live"
            echo "code reads yet costs nothing. The reverse is an outage."
          else
            echo "::error::Production's schema does not match the migrations on this commit."
            echo ""
            echo "Something in production is very likely broken RIGHT NOW — a missing table"
            echo "takes down every page whose query mentions it, while pages that avoid it keep"
            echo "working, so the app looks half-alive rather than down."
            echo ""
            echo "Apply the pending migrations from a machine with production credentials:"
            echo ""
            echo "  MELANITE_ENV_FILE=.env.migration npm run db:migrate"
            echo "  MELANITE_ENV_FILE=.env.migration npm run db:verify"
            echo ""
            echo "No redeploy is needed afterwards: the code is already live and correct."
          fi
          echo ""
          echo "Use db:migrate, NOT db:migrate:kit. drizzle-kit wraps the whole run in one"
          echo "transaction, and 'ALTER TYPE ... ADD VALUE' followed by a use of that value"
          echo "raises 55P04 there. scripts/migrate.ts sends statements one at a time."
